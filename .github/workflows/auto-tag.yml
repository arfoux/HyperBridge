name: Auto Tag

on:
  push:
    branches: [master]
    paths:
      - "app/build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    if: github.repository == 'arfoux/HyperBridge'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get versionName
        id: version
        shell: bash
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VER"
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Version: $VER -> Tag: $TAG"

      - name: Check if tag already exists
        id: check
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists"
          elif git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists on remote"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist, will create"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Pushed tag $TAG"

      # GITHUB_TOKEN push tidak trigger workflow push tags (proteksi loop), jadi trigger Release via workflow_dispatch
      # Release akan reuse artifact dari Build Debug APK (hemat 1x build) tapi tetap publish ke Releases (tanpa login)
      - name: Trigger Release workflow (efficient, reuse artifact)
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          echo "Dispatching Release APK for $TAG (reuse Build artifact)"
          if gh workflow run "Release APK" --ref master -f tag="$TAG" 2>/dev/null; then
            echo "Dispatched via gh"
          else
            echo "gh failed, fallback via API"
            curl -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/release.yml/dispatches \
              -d "{\"ref\":\"master\",\"inputs\":{\"tag\":\"$TAG\"}}" || true
          fi
