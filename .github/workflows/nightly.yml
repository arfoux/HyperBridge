name: Nightly Release

on:
  workflow_run:
    workflows: ["Build Debug APK"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'arfoux/HyperBridge' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK from Build workflow
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: app-debug
          path: ./artifact
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name == 'workflow_dispatch'

      - uses: android-actions/setup-android@v3
        if: github.event_name == 'workflow_dispatch'

      - name: Grant execute permission for gradlew
        if: github.event_name == 'workflow_dispatch'
        run: chmod +x gradlew

      - name: Build Debug APK (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare nightly APK
        shell: bash
        run: |
          mkdir -p dist
          if [ -f ./artifact/app-debug.apk ]; then
            echo "Using artifact from Build workflow"
            ls -lh ./artifact/
            SHORT_SHA="${{ github.event.workflow_run.head_sha }}"
            SHORT_SHA=${SHORT_SHA:0:7}
            if [ -z "$SHORT_SHA" ]; then SHORT_SHA=$(git rev-parse --short HEAD); fi
            cp ./artifact/app-debug.apk "dist/HyperBridge-nightly-${SHORT_SHA}.apk"
            cp ./artifact/app-debug.apk "dist/HyperBridge-nightly.apk"
          else
            echo "Using locally built APK"
            ls -lh app/build/outputs/apk/debug/
            SHORT_SHA=$(git rev-parse --short HEAD)
            cp app/build/outputs/apk/debug/app-debug.apk "dist/HyperBridge-nightly-${SHORT_SHA}.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "dist/HyperBridge-nightly.apk"
          fi
          ls -lh dist/

      - name: Publish nightly release (continuous)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build"
          body: |
            Auto-built from `master` — commit `${{ github.event.workflow_run.head_sha || github.sha }}`

            - Direct APK: `HyperBridge-nightly.apk` (latest, tanpa login)
            - Versioned: `HyperBridge-nightly-<sha>.apk`
            - Also via [nightly.link](https://nightly.link/arfoux/HyperBridge/workflows/build.yml/refs/heads/master/app-debug.zip) (tanpa login, expire 14d)

            Rolling pre-release, update otomatis tiap push ke `master` (reuse artifact dari Build Debug APK, tanpa build ulang).
          files: dist/*.apk
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
