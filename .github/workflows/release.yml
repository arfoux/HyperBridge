name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (contoh: v0.5.8) - kosongkan untuk pakai versionName dari build.gradle"
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
            echo "tag=v$VER" >> $GITHUB_OUTPUT
          fi
          echo "Resolved tag: $(cat $GITHUB_OUTPUT)"

      # Efisien: kalau dipicu via auto-tag (workflow_dispatch), reuse artifact dari Build Debug APK biar hemat 1x build (4-7m)
      # Artifacts butuh login, Releases (dist/*.apk) tidak — jadi user tetap bisa download langsung tanpa login
      - name: Wait for Build workflow (only for auto-tag dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          echo "Waiting for Build Debug APK to complete for efficient reuse..."
          for i in {1..18}; do
            STATUS=$(gh run list --workflow="Build Debug APK" --branch=master --limit 1 --json status,conclusion --jq '.[0].status' 2>/dev/null || echo "unknown")
            CONCL=$(gh run list --workflow="Build Debug APK" --branch=master --limit 1 --json status,conclusion --jq '.[0].conclusion' 2>/dev/null || echo "unknown")
            echo "Attempt $i: status=$STATUS conclusion=$CONCL"
            if [[ "$STATUS" == "completed" && "$CONCL" == "success" ]]; then break; fi
            # Jika masih in_progress/queued, tunggu 20s
            sleep 20
          done

      - name: Try download artifact from Build workflow
        id: dl
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build.yml
          workflow_conclusion: success
          name: app-debug
          branch: master
          path: /tmp/art
          if_no_artifact_found: warn
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check downloaded artifact
        id: check_dl
        shell: bash
        run: |
          FOUND=false
          if [ -f /tmp/art/app-debug.apk ]; then
            FOUND=true
            mkdir -p app/build/outputs/apk/debug
            cp /tmp/art/app-debug.apk app/build/outputs/apk/debug/app-debug.apk
            echo "Reused artifact /tmp/art/app-debug.apk"
          elif [ -f /tmp/art/app-debug/app-debug.apk ]; then
            FOUND=true
            mkdir -p app/build/outputs/apk/debug
            cp /tmp/art/app-debug/app-debug.apk app/build/outputs/apk/debug/app-debug.apk
            echo "Reused artifact /tmp/art/app-debug/app-debug.apk"
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            FOUND=true
            echo "Already exists app/build/outputs/apk/debug/app-debug.apk (maybe from previous step)"
          else
            echo "No reusable artifact found, will build"
          fi
          echo "found=$FOUND" >> $GITHUB_OUTPUT
          ls -lh app/build/outputs/apk/debug/ 2>/dev/null || true
          ls -lh /tmp/art/ 2>/dev/null || true

      - uses: actions/setup-java@v4
        if: steps.check_dl.outputs.found != 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.check_dl.outputs.found != 'true'

      - uses: android-actions/setup-android@v3
        if: steps.check_dl.outputs.found != 'true'

      - name: Grant execute permission for gradlew
        if: steps.check_dl.outputs.found != 'true'
        run: chmod +x gradlew

      - name: Build Debug APK
        if: steps.check_dl.outputs.found != 'true'
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK (unsigned/minified, optional)
        if: steps.check_dl.outputs.found != 'true'
        continue-on-error: true
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APKs
        shell: bash
        run: |
          ls -lh app/build/outputs/apk/debug/ || true
          ls -lh app/build/outputs/apk/release/ || true
          mkdir -p dist
          TAG="${{ steps.tag.outputs.tag }}"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/HyperBridge-${TAG}-debug.apk" || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/HyperBridge-${TAG}-release.apk" || true
            cp app/build/outputs/apk/release/app-release.apk "dist/HyperBridge-${TAG}.apk" || true
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/HyperBridge-${TAG}.apk" || true
          fi
          ls -lh dist/

      - name: Generate release notes
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PREV=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "## HyperBridge $TAG" > release_notes.md
          echo "" >> release_notes.md
          if [ -n "$PREV" ] && [ "$PREV" != "$TAG" ]; then
            echo "### Changes since $PREV" >> release_notes.md
            git log "$PREV"..HEAD --pretty=format:"- %s (%h)" >> release_notes.md || true
          else
            echo "### Changes" >> release_notes.md
            git log --pretty=format:"- %s (%h)" -20 >> release_notes.md || true
          fi
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 📥 Download" >> release_notes.md
          echo "- \`HyperBridge-${TAG}.apk\` — Universal APK (debug/release)" >> release_notes.md
          echo "- Also available via [nightly.link](https://nightly.link/arfoux/HyperBridge/workflows/build.yml/refs/heads/master/app-debug.zip)" >> release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: HyperBridge ${{ steps.tag.outputs.tag }}
          body_path: release_notes.md
          files: dist/*.apk
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
